name: Ray review follow-up validation

"on":
  workflow_dispatch:
  push:
    branches: ['audit/ray-review-followup']
    paths:
      - 'research/ray-review-followup/**'
      - '.github/workflows/ray-review-followup.yml'

permissions:
  contents: read

jobs:
  linux-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAY_USAGE_STATS_ENABLED: '0'
      RAY_ENABLE_AUTO_CONNECT: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out the exact audit bundle
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check out original native/source base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ray-project/ray
          ref: 80142bad1d1db176f19c7e3aff6b6448631e66c2
          path: _ray_source
          persist-credentials: false
          fetch-depth: 1
      - name: Set up CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install one verified native environment for both conditions
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/ray-followup-runtime
          exec > >(tee evidence/ray-followup-runtime/setup.log) 2>&1
          python -m venv "$RUNNER_TEMP/ray-followup-runtime"
          py="$RUNNER_TEMP/ray-followup-runtime/bin/python"
          "$py" -m pip install --upgrade pip
          wheel="$RUNNER_TEMP/ray-3.0.0.dev0-cp312-cp312-manylinux2014_x86_64.whl"
          curl --fail --location --retry 3 --max-time 180 \
            'https://s3-us-west-2.amazonaws.com/ray-wheels/master/80142bad1d1db176f19c7e3aff6b6448631e66c2/ray-3.0.0.dev0-cp312-cp312-manylinux2014_x86_64.whl' \
            --output "$wheel"
          printf '%s  %s\n' '59d62dcfdf70053b47875c4e354e04bcbfaab107e8f8365b03d1e8644f7f7a41' "$wheel" | sha256sum --check
          "$py" -m pip install "$wheel[serve]" 'pytest==9.1.1' 'pytest-asyncio==1.4.0' \
            'pytest-timeout==2.4.0' 'psutil==7.2.2' 'httpx==0.28.1' jinja2 numpy
          "$py" -m pip freeze --all > evidence/ray-followup-runtime/installed-packages.txt
          sha256sum "$wheel" > evidence/ray-followup-runtime/wheel.sha256
      - name: Fetch exact submitted PR commit, verify delta, and run actual pytest checker
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ray-followup-runtime/bin/python" research/ray-review-followup/run_followup_ci.py prepare \
            --source-root "$GITHUB_WORKSPACE/_ray_source" \
            --evidence-dir "$GITHUB_WORKSPACE/evidence/ray-followup-runtime"
      - name: Link candidate Serve and standard test fixtures into the native wheel
        shell: bash
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/ray-followup-runtime/bin/python"
          "$py" _ray_source/python/ray/setup-dev.py -y --allow serve
          "$py" _ray_source/python/ray/setup-dev.py -y --allow tests
      - name: Confirm regression and run all 32 candidate tests
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ray-followup-runtime/bin/python" research/ray-review-followup/run_followup_ci.py runtime \
            --source-root "$GITHUB_WORKSPACE/_ray_source" \
            --evidence-dir "$GITHUB_WORKSPACE/evidence/ray-followup-runtime"
      - name: Preserve runtime evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ray-followup-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/ray-followup-runtime/
          if-no-files-found: warn
          retention-days: 14

  linux-full-precommit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out the exact audit bundle
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check out full original source for type resolution and hooks
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ray-project/ray
          ref: 80142bad1d1db176f19c7e3aff6b6448631e66c2
          path: _ray_source
          persist-credentials: false
          fetch-depth: 1
      - name: Set up CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Create isolated upstream-required pre-commit environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/ray-followup-lint
          exec > >(tee evidence/ray-followup-lint/setup.log) 2>&1
          python -m venv "$RUNNER_TEMP/ray-followup-lint"
          "$RUNNER_TEMP/ray-followup-lint/bin/python" -m pip install 'pre-commit==3.5.0'
      - name: Apply only the hash-verified delta to the submitted PR commit
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ray-followup-lint/bin/python" research/ray-review-followup/run_followup_ci.py prepare \
            --source-root "$GITHUB_WORKSPACE/_ray_source" \
            --evidence-dir "$GITHUB_WORKSPACE/evidence/ray-followup-lint"
      - name: Run every configured pre-commit hook with normal file filtering
        timeout-minutes: 31
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/ray-followup-lint/bin:$PATH"
          "$RUNNER_TEMP/ray-followup-lint/bin/python" research/ray-review-followup/run_followup_ci.py lint \
            --source-root "$GITHUB_WORKSPACE/_ray_source" \
            --evidence-dir "$GITHUB_WORKSPACE/evidence/ray-followup-lint"
      - name: Preserve hook evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ray-followup-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/ray-followup-lint/
          if-no-files-found: warn
          retention-days: 14
